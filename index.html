<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Life Church — 30th Anniversary Timeline</title>
<link rel="stylesheet" href="css/style.css?v=54">
</head>
<body>

  <div class="viewport">
    <div class="stage" id="stage" data-format="1920">

      <!-- ============ SCENE: LOGO ============ -->
      <section class="scene" id="scene-logo">

        <!-- the timeline rule. lives at the exact centerY the timeline scene uses -->
        <div class="rule" id="logo-rule"></div>

        <div class="logo-stack" id="logo-stack">
          <div class="logo-wordmark" id="logo-wordmark">The Life Church</div>
          <img class="logo-mark" id="logo-mark" src="assets/logo/30years-mustard.png" alt="30 years">
          <div class="logo-dates" id="logo-dates">
            <span class="logo-dates__rule logo-dates__rule--l" id="logo-rule-l"></span>
            <span class="logo-dates__text">1996 &mdash; 2026</span>
            <span class="logo-dates__rule logo-dates__rule--r" id="logo-rule-r"></span>
          </div>
        </div>

        <!-- the seed the expanded card will grow from -->
        <div class="seed" id="logo-seed"></div>

      </section>

      <!-- ============ SCENE: TIMELINE ============ -->
      <section class="scene" id="scene-timeline">

        <div class="rule" style="transform:scaleX(1)"></div>
        <div class="strip" id="tl-strip"></div>

        <!-- the wrap carries the movement so the outline can sit OUTSIDE
             the clip: clip-path cascades to children, so a stroke drawn
             inside the card would have its outer half cut away. -->
        <div class="expanded-wrap" id="tl-wrap">
          <div class="expanded" id="tl-expanded">
          <div class="exp__photo" id="exp-photo"></div>
          <div class="exp__divider" id="exp-divider"></div>
          <div class="exp__panel" id="exp-panel">
            <div class="exp__label" id="exp-label"><span id="exp-label-t"></span></div>
            <div class="exp__year"  id="exp-year"></div>
            <div class="exp__title" id="exp-title"></div>
            <!-- the paragraph creeps inside this window -->
            <div class="exp__body"  id="exp-body">
              <div class="exp__bodyinner" id="exp-bodyinner">
                <p class="exp__para" id="exp-para"></p>
              </div>
            </div>

            <!-- optional. pinned to the foot of the panel, never scrolls -->
            <div class="exp__stat" id="exp-stat"></div>
          </div>
          </div>

          <!-- the outline. percentages as coordinates, and a stroke that
               refuses to scale with them, so 14px stays 14px on every
               edge of the lozenge and of the rectangle alike. -->
          <!-- no viewBox on purpose: the svg's user space is then 1:1 with
               its css size, which is already the stage's units, so a 14
               stroke is 14 stage px and scales with the card's border.
               percentages plus non-scaling-stroke held the outline at 14
               SCREEN px while the border shrank with the stage. -->
          <svg class="exp__frame" id="exp-frame" aria-hidden="true">
            <polygon id="exp-frame-poly" />
          </svg>
        </div>

      </section>

      <!-- ============ THE RUNNING BARS ============ -->
      <!-- outside the scenes on purpose: they frame the whole piece -->
      <div class="ticker ticker--top"><div class="ticker__track"></div></div>
      <div class="ticker ticker--bottom"><div class="ticker__track"></div></div>

    </div>
  </div>

  <!-- viewer controls. deliberately OUTSIDE the stage, like the HUD:
       nothing here can ever land in a rendered frame. -->
  <div class="controls" id="controls">
    <button class="pill" id="btn-prev"  title="Previous date  (up arrow)">&#8676;</button>
    <button class="pill" id="btn-play"  title="Play / pause  (space)"><span id="btn-play-i">&#9654;</span></button>
    <button class="pill" id="btn-stop"  title="Stop">&#9632;</button>
    <button class="pill" id="btn-again" title="Start over  (R)">&#8635;</button>
    <button class="pill" id="btn-next"  title="Next date  (down arrow)">&#8677;</button>
    <button class="pill" id="btn-note"  title="Leave a note on this date  (N)">+</button>
  </div>

  <!-- review notes. lives outside the stage, never rendered into a frame -->
  <div class="notes" id="notes">
    <div class="notes__where" id="notes-where"></div>
    <div class="notes__when"  id="notes-when"></div>
    <textarea id="notes-text" placeholder="What would you change about this one?"></textarea>
    <div class="notes__row">
      <button class="notes__btn" id="notes-save">Save</button>
      <button class="notes__btn notes__btn--ghost" id="notes-copy">Copy all</button>
    </div>
    <div class="notes__count" id="notes-count"></div>
  </div>

  <div class="small-screen">
    <p>
      <b>The Life Church &middot; 30 Years</b>
      This piece is built for a 1920&times;1080 screen.
      Please open it on a desktop or laptop.
    </p>
  </div>

  <div class="hud" id="hud">
    <span class="hud__mode" id="hud-mode">PAUSED</span>
    <span class="hud__time" id="hud-time">0.00s</span>
    <span class="hud__scene" id="hud-scene">logo</span>
    <span class="hud__fmt" id="hud-fmt">1920&times;1080</span>
    <span class="hud__keys">space play &middot; &larr;&rarr; beat &middot; &#8679;&larr;&rarr; 0.1s &middot; R reset &middot; 1/2/3 size &middot; 4/6/8 distance &middot; 0 fit &middot; &darr;&uarr; date &middot; WASD crop &middot; X copy &middot; H hide</span>
    <span class="hud__focus" id="hud-focus"></span>
  </div>

<script src="js/anim.js?v=54"></script>
<script src="js/logo.js?v=54"></script>
<script src="js/timeline.js?v=54"></script>
<script src="js/ticker.js?v=54"></script>
<script src="js/notes.js?v=54"></script>
<script src="js/outro.js?v=54"></script>
<script src="js/main.js?v=54"></script>
</body>
</html>
